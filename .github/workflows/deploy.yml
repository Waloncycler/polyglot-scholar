name: Polyglot Scholar CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    # Frontend Checks
    - name: Install Frontend Dependencies
      run: npm ci

    - name: Lint Frontend
      run: npm run lint

    # Backend Checks
    - name: Install Backend Dependencies
      working-directory: ./server
      run: npm ci

    # Docker Build & Push
    - name: Downcase IMAGE_NAME
      run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pro
    
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            export FULL_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "Deploying $FULL_IMAGE_NAME:latest..."
            
            # Login to GHCR on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Ensure deploy directory exists
            mkdir -p ~/apps/polyglot-scholar
            cd ~/apps/polyglot-scholar
            
            # Create .env file if not exists
            if [ ! -f .env ]; then
              echo "Creating default .env file..."
              echo "PORT=3000" > .env
              echo "NODE_ENV=production" >> .env
              # You can add more default variables here if needed
            fi
            
            # Create deploy script if not exists (or update it)
            # Ideally this script should be part of the repo and copied over, 
            # but creating it here ensures it works even if repo is not cloned on server.
            cat << 'EOF' > deploy.sh
            #!/bin/bash
            set -e
            IMAGE=$1
            TAG=$2
            FULL_IMG="$IMAGE:$TAG"
            CONTAINER="polyglot-scholar"
            
            echo "Pulling $FULL_IMG..."
            docker pull $FULL_IMG
            
            echo "Stopping old container..."
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true
            
            echo "Starting new container..."
            docker run -d \
              --name $CONTAINER \
              --restart always \
              -p 8080:3000 \
              --env-file .env \
              $FULL_IMG
            
            # Prune old images to save space
            docker image prune -f
            EOF
            
            chmod +x deploy.sh
            
            # Execute deployment
            ./deploy.sh $FULL_IMAGE_NAME latest
